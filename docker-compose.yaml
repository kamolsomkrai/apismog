services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_api
    restart: unless-stopped
    ports:
      - "3006:3000"
    env_file:
      - .env
    environment:
      - API_URL=${API_URL}
    networks:
      - nginx_networks
networks:
  nginx_networks:
    external: true
